<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ID Project Estimator</title>
    <style>
      #auth-gate {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 2147483647;
      }
      #auth-gate .card {
        background: #ffffff;
        padding: 32px 28px;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        width: 100%;
        max-width: 340px;
      }
      #auth-gate h1 {
        margin: 0 0 4px;
        font-size: 18px;
        color: #0f172a;
      }
      #auth-gate p {
        margin: 0 0 20px;
        font-size: 13px;
        color: #64748b;
      }
      #auth-gate label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 6px;
      }
      #auth-gate input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 14px;
        outline: none;
      }
      #auth-gate input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      #auth-gate button {
        width: 100%;
        padding: 10px 12px;
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #auth-gate button:hover {
        background: #1d4ed8;
      }
      #auth-gate .error {
        color: #dc2626;
        font-size: 12px;
        min-height: 16px;
        margin: -6px 0 8px;
      }
    </style>
    <script>
      (function () {
        var EXPECTED_HASH =
          "8693b90bf791f5145b8789573af0fbcc8d03d13ce64e4fa19210cd88f51d974f";
        var STORAGE_KEY = "id-estimator-auth";
        var BUNDLE_SRC = "/id-estimator/assets/index-D4o3ATea.js";

        async function sha256(str) {
          var buf = new TextEncoder().encode(str);
          var hash = await crypto.subtle.digest("SHA-256", buf);
          return Array.from(new Uint8Array(hash))
            .map(function (b) {
              return b.toString(16).padStart(2, "0");
            })
            .join("");
        }

        function loadApp() {
          var gate = document.getElementById("auth-gate");
          if (gate) gate.remove();
          var s = document.createElement("script");
          s.type = "module";
          s.crossOrigin = "anonymous";
          s.src = BUNDLE_SRC;
          document.body.appendChild(s);
        }

        function renderGate() {
          document.addEventListener("DOMContentLoaded", function () {
            var gate = document.createElement("div");
            gate.id = "auth-gate";
            gate.innerHTML =
              '<form class="card" id="auth-form">' +
              "<h1>ID Project Estimator</h1>" +
              "<p>Please sign in to continue.</p>" +
              '<label for="auth-user">Username</label>' +
              '<input id="auth-user" type="text" autocomplete="username" autofocus />' +
              '<label for="auth-pass">Password</label>' +
              '<input id="auth-pass" type="password" autocomplete="current-password" />' +
              '<div class="error" id="auth-error"></div>' +
              '<button type="submit">Sign in</button>' +
              "</form>";
            document.body.appendChild(gate);

            document
              .getElementById("auth-form")
              .addEventListener("submit", async function (e) {
                e.preventDefault();
                var user = document.getElementById("auth-user").value.trim();
                var pass = document.getElementById("auth-pass").value;
                var err = document.getElementById("auth-error");
                err.textContent = "";
                try {
                  var hash = await sha256(user + ":" + pass);
                  if (hash === EXPECTED_HASH) {
                    try {
                      localStorage.setItem(STORAGE_KEY, hash);
                    } catch (_) {}
                    loadApp();
                  } else {
                    err.textContent = "Invalid username or password.";
                    document.getElementById("auth-pass").value = "";
                  }
                } catch (_) {
                  err.textContent = "Authentication error.";
                }
              });
          });
        }

        try {
          if (localStorage.getItem(STORAGE_KEY) === EXPECTED_HASH) {
            document.addEventListener("DOMContentLoaded", loadApp);
            return;
          }
        } catch (_) {}
        renderGate();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
