<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/id-estimator/favicon.svg" />
    <title>Esti-Mate</title>
    <style>
      #auth-gate {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1c1917;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 2147483647;
      }
      #auth-gate .card {
        background: #292524;
        border: 1px solid #44403c;
        padding: 32px 28px;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 340px;
      }
      #auth-gate .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      #auth-gate .brand svg {
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
      }
      #auth-gate h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f5f5f4;
      }
      #auth-gate p {
        margin: 0 0 20px;
        font-size: 13px;
        color: #a8a29e;
      }
      #auth-gate label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #d6d3d1;
        margin-bottom: 6px;
      }
      #auth-gate input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        background: #1c1917;
        border: 1px solid #44403c;
        border-radius: 8px;
        font-size: 14px;
        color: #f5f5f4;
        margin-bottom: 14px;
        outline: none;
      }
      #auth-gate input:focus {
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
      }
      #auth-gate button {
        width: 100%;
        padding: 10px 12px;
        background: #f59e0b;
        color: #1c1917;
        border: 0;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      #auth-gate button:hover {
        background: #fbbf24;
      }
      #auth-gate .error {
        color: #f87171;
        font-size: 12px;
        min-height: 16px;
        margin: -6px 0 8px;
      }
      #brand-badge {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px 8px 10px;
        background: rgba(41, 37, 36, 0.92);
        border: 1px solid #44403c;
        border-radius: 999px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f5f5f4;
        z-index: 2147483646;
        pointer-events: none;
        user-select: none;
        backdrop-filter: blur(6px);
      }
      #brand-badge svg {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
      }
    </style>
    <script>
      (function () {
        var EXPECTED_HASH =
          "8693b90bf791f5145b8789573af0fbcc8d03d13ce64e4fa19210cd88f51d974f";
        var STORAGE_KEY = "id-estimator-auth";
        var BUNDLE_SRC = "/id-estimator/assets/index-D4o3ATea.js";

        async function sha256(str) {
          var buf = new TextEncoder().encode(str);
          var hash = await crypto.subtle.digest("SHA-256", buf);
          return Array.from(new Uint8Array(hash))
            .map(function (b) {
              return b.toString(16).padStart(2, "0");
            })
            .join("");
        }

        function mountBadge() {
          if (document.getElementById("brand-badge")) return;
          var badge = document.createElement("div");
          badge.id = "brand-badge";
          badge.innerHTML =
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">' +
            '<rect width="48" height="48" rx="10" fill="#f59e0b"/>' +
            '<rect x="12" y="18" width="24" height="4" rx="2" fill="#1c1917"/>' +
            '<rect x="12" y="26" width="24" height="4" rx="2" fill="#1c1917"/>' +
            "</svg>" +
            "<span>Esti-Mate</span>";
          document.body.appendChild(badge);
        }

        function loadApp() {
          var gate = document.getElementById("auth-gate");
          if (gate) gate.remove();
          var s = document.createElement("script");
          s.type = "module";
          s.crossOrigin = "anonymous";
          s.src = BUNDLE_SRC;
          document.body.appendChild(s);
          mountBadge();
        }

        function renderGate() {
          document.addEventListener("DOMContentLoaded", function () {
            var gate = document.createElement("div");
            gate.id = "auth-gate";
            gate.innerHTML =
              '<form class="card" id="auth-form">' +
              '<div class="brand">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">' +
              '<rect width="48" height="48" rx="10" fill="#7e14ff"/>' +
              '<rect x="12" y="18" width="24" height="4" rx="2" fill="#ffffff"/>' +
              '<rect x="12" y="26" width="24" height="4" rx="2" fill="#ffffff"/>' +
              "</svg>" +
              "<h1>Esti-Mate</h1>" +
              "</div>" +
              "<p>Please sign in to continue.</p>" +
              '<label for="auth-user">Username</label>' +
              '<input id="auth-user" type="text" autocomplete="username" autofocus />' +
              '<label for="auth-pass">Password</label>' +
              '<input id="auth-pass" type="password" autocomplete="current-password" />' +
              '<div class="error" id="auth-error"></div>' +
              '<button type="submit">Sign in</button>' +
              "</form>";
            document.body.appendChild(gate);

            document
              .getElementById("auth-form")
              .addEventListener("submit", async function (e) {
                e.preventDefault();
                var user = document.getElementById("auth-user").value.trim();
                var pass = document.getElementById("auth-pass").value;
                var err = document.getElementById("auth-error");
                err.textContent = "";
                try {
                  var hash = await sha256(user + ":" + pass);
                  if (hash === EXPECTED_HASH) {
                    try {
                      localStorage.setItem(STORAGE_KEY, hash);
                    } catch (_) {}
                    loadApp();
                  } else {
                    err.textContent = "Invalid username or password.";
                    document.getElementById("auth-pass").value = "";
                  }
                } catch (_) {
                  err.textContent = "Authentication error.";
                }
              });
          });
        }

        try {
          if (localStorage.getItem(STORAGE_KEY) === EXPECTED_HASH) {
            document.addEventListener("DOMContentLoaded", loadApp);
            return;
          }
        } catch (_) {}
        renderGate();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
